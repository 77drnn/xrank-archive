name: Collect P-season X rankings and publish site

on:
  workflow_dispatch:
    inputs:
      backfill_archive:
        description: 'Pシーズンの全アーカイブを優先して再スキャンする（1回最大30分、途中から再開）'
        required: false
        type: boolean
        default: false
  schedule:
    # UTC. Runs even when the user's computer/site is closed; GitHub can delay schedules.
    - cron: '10 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xrank-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy_attempt_1.outputs.page_url || steps.deploy_attempt_2.outputs.page_url || steps.deploy_attempt_3.outputs.page_url }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install archive compression dependency
        run: python -m pip install -r requirements.txt

      - name: Enforce permanent player identifiers only
        run: python scripts/strictify_xrank_identity.py

      - name: Fetch the newest X ranking for all four rules
        shell: bash
        run: |
          test -f update_xrank.py || { echo "::error::update_xrank.py がリポジトリ直下にありません"; exit 1; }
          if [ "${{ github.event.inputs.backfill_archive }}" = "true" ]; then
            python update_xrank.py --backfill-archive
          else
            python update_xrank.py
          fi
          echo "update_xrank.py completed: current P-season ranking should include all four rules."

      - name: Import missing P-season source rankings from splatoon3.ink
        run: python scripts/import_missing_p_seasons.py

      - name: Import Japanese festival rankings and build all-time festival top 1000
        run: python scripts/import_fest_rankings.py

      - name: Build all-time X power ranking (overall TOP 1500, each rule TOP 500)
        run: python scripts/build-all-time-ranking.py

      - name: Set up Node.js for weapon ranking aggregation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build precomputed weapon ranking JSON
        run: node scripts/build-weapon-ranking.js

      - name: Prepare mobile-friendly static site
        run: python prepare_site.py

      - name: Save changed data to repository
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No ranking data changes; publishing the refreshed static site anyway."
          else
            git commit -m "Update P-season X ranking archive"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (unique per run attempt)
        uses: actions/upload-pages-artifact@v3
        with:
          # Failed-job reruns keep artifacts from earlier attempts in the same run.
          # Give each attempt a distinct name so deploy-pages finds exactly one.
          name: github-pages-${{ github.run_attempt }}
          path: public

      # GitHub Pages occasionally accepts a deployment but leaves it queued or
      # fails it on the service side. The first two attempts are non-fatal;
      # a final failed attempt makes the job fail normally.
      - name: Publish to GitHub Pages (attempt 1)
        id: deploy_attempt_1
        uses: actions/deploy-pages@v5.0.1
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000

      - name: Wait before retrying Pages deployment (attempt 2)
        if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
        run: sleep 30

      - name: Publish to GitHub Pages (attempt 2)
        id: deploy_attempt_2
        if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5.0.1
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000

      - name: Wait before final Pages deployment retry
        if: ${{ steps.deploy_attempt_2.outcome == 'failure' }}
        run: sleep 60

      - name: Publish to GitHub Pages (attempt 3)
        id: deploy_attempt_3
        if: ${{ steps.deploy_attempt_2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
